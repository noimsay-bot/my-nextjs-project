<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>대한민국 행정구역 인터랙티브 지도</title>
<style>
  :root{
    --bg:#e2e3e6; --edge:#c4c8cd; --ink:#3a3d44; --muted:#7a7f87;
  }
  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
       background:var(--bg);color:var(--ink);}
  #wrap{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;height:100%;max-width:760px;margin:0 auto;padding:10px 14px 8px;}
  header{display:flex;align-items:center;gap:10px;min-height:42px;}
  #back{border:none;background:#fff;border-radius:9px;padding:7px 13px;font-size:14px;cursor:pointer;
        box-shadow:0 2px 6px rgba(0,0,0,.12);color:var(--ink);display:none;}
  #back:hover{background:#f4f5f7;}
  #title{font-size:18px;font-weight:700;letter-spacing:-.3px;}
  #sub{font-size:12px;color:var(--muted);margin-left:auto;min-height:16px;}
  #stage{position:relative;display:grid;width:100%;min-height:0;place-items:center;}
  svg{display:block;width:auto;max-width:100%;height:100%;max-height:100%;}
  .rg{fill:transparent;stroke:var(--edge);stroke-width:1.1;stroke-linejoin:round;
      pointer-events:all;cursor:pointer;transition:fill .12s;}
  .rg:hover:not(.marked){fill:rgba(70,110,200,.18);}
  .rg.marked:hover{filter:brightness(1.07);}
  .sil{pointer-events:none;}
  #tools{display:flex;align-items:center;gap:8px;margin:10px 2px 4px;flex-wrap:wrap;}
  .swatch{width:26px;height:26px;border-radius:7px;border:2px solid #fff;cursor:pointer;
          box-shadow:0 1px 4px rgba(0,0,0,.18);}
  .swatch.active{outline:2px solid var(--ink);outline-offset:1px;}
  #tools .lbl{font-size:12px;color:var(--muted);}
  #reset{margin-left:auto;border:none;background:#fff;border-radius:8px;padding:6px 11px;font-size:13px;
         cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.14);color:var(--ink);}
  #hint{font-size:12px;color:var(--muted);margin:8px 2px;}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <button id="back">‹ 전국</button>
    <div id="title">대한민국 (시·도)</div>

  </header>
  <div id="tools" hidden>
    <span class="lbl">표시색</span>

    <div class="swatch" data-c="#e0453c"></div>
    <div class="swatch" data-c="#f2b234"></div>
    <div class="swatch" data-c="#3aa564"></div>
    <div class="swatch" data-c="#8a8f98"></div>
    <button id="reset">표시 지우기</button>

  <div id="stage"></div>

</div>

MAP.details = MAP.details ?? Object.fromEntries(Object.entries(MAP).filter(([code]) => code !== 'national'));

const stage = document.getElementById('stage');
const back  = document.getElementById('back');
const title = document.getElementById('title');
const sub   = document.getElementById('sub');
const tools = document.getElementById('tools');

let view = 'national';          // 'national' or province code
let curColor = '#2f6fe0';
const marks = {};               // { provCode: { regionCode: color } }

const DEFS = `
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="6" dy="15" stdDeviation="13" flood-color="#3a3d44" flood-opacity="0.30"/>
    </filter>
    <linearGradient id="sheen" x1="0.15" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#eef0f2"/>
    </linearGradient>
  </defs>`;

function buildSVG(v){
  const [x,y,w,h] = v.viewBox;
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${DEFS}`;
  s += `<path class="sil" d="${v.silhouette}" fill="url(#sheen)" filter="url(#soft)" fill-rule="evenodd"/>`;
  for(const r of v.regions){
    s += `<path class="rg" data-code="${r.code}" data-name="${r.name}" d="${r.d}"><title>${r.name}</title></path>`;
  }
  s += `</svg>`;
  return s;
}

function render(){
  if(view === 'national'){
    stage.innerHTML = buildSVG(MAP.national);
    title.textContent = '대한민국 (시·도)';
    back.style.display = 'none';
    tools.hidden = true;
    document.querySelectorAll('.rg').forEach(p=>{
      p.addEventListener('click', ()=>{
        const code = p.dataset.code;
        if(MAP.details[code]){ view = code; render(); }
      });
      p.addEventListener('mouseenter', ()=> sub.textContent = p.dataset.name + '  ›');
      p.addEventListener('mouseleave', ()=> sub.textContent = '');
    });
  } else {
    const det = MAP.details[view];
    stage.innerHTML = buildSVG(det);
    title.textContent = det.name;
    back.style.display = 'inline-block';
    tools.hidden = false;
    const pm = marks[view] || (marks[view] = {});
    document.querySelectorAll('.rg').forEach(p=>{
      const code = p.dataset.code;
      if(pm[code]){ p.classList.add('marked'); p.style.fill = pm[code]; p.style.fillOpacity = .82; }
      p.addEventListener('click', ()=>{
        if(pm[code] === curColor){ delete pm[code]; p.classList.remove('marked'); p.style.fill=''; p.style.fillOpacity=''; }
        else { pm[code] = curColor; p.classList.add('marked'); p.style.fill = curColor; p.style.fillOpacity = .82; }
      });
      p.addEventListener('mouseenter', ()=> sub.textContent = p.dataset.name);
      p.addEventListener('mouseleave', ()=> sub.textContent = '');
    });
  }
}

back.addEventListener('click', ()=>{ view='national'; sub.textContent=''; render(); });
document.getElementById('reset').addEventListener('click', ()=>{
  if(view!=='national'){ marks[view]={}; render(); }
});
document.querySelectorAll('.swatch').forEach((sw,i)=>{
  if(i===0) sw.classList.add('active');
  sw.style.background = sw.dataset.c;
  sw.addEventListener('click', ()=>{
    curColor = sw.dataset.c;
    document.querySelectorAll('.swatch').forEach(o=>o.classList.remove('active'));
    sw.classList.add('active');
  });
});

render();
</script>
