<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>전국 선거구 보기</title>
<style>
  :root{
    --bg:#e2e3e6; --edge:#bfc4cb; --ink:#3a3d44; --muted:#7a7f87;
    --panel:#ffffff; --line:#d5d8dd;
  }
  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
       background:var(--bg);color:var(--ink);}
  #wrap{position:relative;display:grid;grid-template-columns:150px minmax(0,1fr) 459px;grid-template-rows:auto auto minmax(0,1fr);gap:6px;height:100%;width:100%;max-width:none;margin:0;padding:2px 4px;min-height:0;}
  #wrap.detailMode{grid-template-columns:300px minmax(0,1fr) 459px;}
  header{grid-column:1;grid-row:1;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:0;}
  #back{border:none;background:#fff;border-radius:9px;padding:7px 13px;font-size:14px;cursor:pointer;
        box-shadow:0 2px 6px rgba(0,0,0,.12);color:var(--ink);display:none;}
  #back:hover{background:#f4f5f7;}
  #title{font-size:18px;font-weight:800;line-height:1.2;letter-spacing:-.3px;}
  #sub{font-size:12px;color:var(--muted);min-height:16px;line-height:1.3;}
  #pollToggle{display:none;border:none;background:#fff;border-radius:8px;padding:6px 9px;font-size:12px;font-weight:900;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.10);color:var(--ink);}
  #controls{grid-column:1;grid-row:2;display:grid;align-content:start;gap:6px;margin:0;}
  #sidoSelect{width:100%;border:none;background:#fff;border-radius:9px;padding:7px 10px;font-size:14px;cursor:pointer;
              box-shadow:0 2px 6px rgba(0,0,0,.10);color:var(--ink);}
  #loading{font-size:11px;color:var(--muted);line-height:1.35;}
  #miniNationalWrap{display:none;gap:5px;margin-top:2px;}
  #miniNationalWrap.open{display:grid;}
  .miniMapTitle{font-size:11px;color:#59616d;font-weight:900;line-height:1.25;}
  #miniNationalMap{height:440px;min-height:0;border:1px solid rgba(148,163,184,.60);border-radius:9px;background:rgba(255,255,255,.46);padding:4px;overflow:hidden;}
  #miniNationalMap svg{width:100%;height:100%;max-width:none;max-height:none;}
  #miniNationalMap .sido-label{font-size:16px;}
  #miniNationalMap .sido-hit.current{fill:#2f6fe0;fill-opacity:.22;}
  #stage{grid-column:2;grid-row:1 / -1;position:relative;display:grid;width:100%;min-height:0;place-items:center;overflow:hidden;}
  svg{display:block;width:auto;max-width:100%;height:100%;max-height:100%;}
  .base path{fill:url(#sheen);stroke:none;pointer-events:none;}
  .sido-boundary{fill:none;stroke:var(--edge);stroke-width:1.05;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none;}
  .sido-hit{fill:#2f6fe0;fill-opacity:0;stroke:none;pointer-events:all;cursor:pointer;transition:fill-opacity .12s;}
  .sido-hit.hovered{fill-opacity:.16;}
  .rg{fill:transparent;stroke:var(--edge);stroke-width:0.9;stroke-linejoin:round;stroke-linecap:round;
      vector-effect:non-scaling-stroke;pointer-events:all;transition:fill .12s, stroke .12s;}
  .rg:hover{fill:rgba(70,110,200,.18);stroke:#8f98a7;}
  .sido-label{font-size:11px;fill:#606773;pointer-events:none;text-anchor:middle;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;}
  .election-pin-line{stroke:#1f2937;stroke-width:1.4;stroke-opacity:.45;vector-effect:non-scaling-stroke;pointer-events:none;}
  .election-national-pin{cursor:pointer;}
  .election-pin-dot{fill:#111827;stroke:#fff;stroke-width:3;filter:drop-shadow(0 2px 3px rgba(15,23,42,.28));}
  .election-pin-count{fill:#fff;font-size:15px;font-weight:900;text-anchor:middle;dominant-baseline:middle;pointer-events:none;}
  .election-point-pin{fill:#ef4444;stroke:#fff;stroke-width:3;filter:drop-shadow(0 2px 3px rgba(15,23,42,.28));}
  .election-point-number{fill:#fff;font-size:11px;font-weight:900;text-anchor:middle;dominant-baseline:middle;pointer-events:none;}
  .election-card-fo{overflow:visible;pointer-events:auto;cursor:grab;}
  .election-card-fo.dragging{cursor:grabbing;}
  .election-card{height:100%;padding:10px;border:1px solid rgba(15,23,42,.18);border-radius:8px;background:rgba(255,255,255,.96);box-shadow:0 8px 20px rgba(15,23,42,.20);font-size:10px;line-height:1.25;color:#1f2937;overflow:visible;user-select:none;}
  .election-card-title{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:6px;margin-bottom:7px;font-size:13px;font-weight:900;}
  .election-card-title-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .election-card-badge{display:inline-grid;place-items:center;flex:0 0 auto;width:20px;height:20px;border-radius:99px;background:#111827;color:#fff;font-size:10px;font-weight:900;}
  .election-card-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
  .election-card-row{position:relative;display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px;min-height:21px;align-items:center;padding:3px 5px;border:1px solid rgba(148,163,184,.26);border-radius:5px;background:rgba(248,250,252,.86);}
  .election-card-row.wide{grid-column:1 / -1;}
  .election-card-row.expandable{cursor:pointer;}
  .election-card-row b{color:#64748b;font-weight:900;}
  .election-card-value{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800;color:#111827;}
  .election-card-row.expanded{z-index:30;grid-column:1 / -1;align-items:start;background:#fff;box-shadow:0 8px 18px rgba(15,23,42,.14);}
  .election-card-row.expanded .election-card-value{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.35;}
  .election-card-row[data-full]:hover::after{content:attr(data-full);position:absolute;z-index:50;left:0;top:calc(100% + 6px);width:max-content;max-width:260px;padding:7px 9px;border:1px solid rgba(15,23,42,.22);border-radius:7px;background:#111827;color:#fff;box-shadow:0 10px 24px rgba(15,23,42,.26);font-size:11px;font-weight:800;line-height:1.35;white-space:pre-wrap;pointer-events:none;}
  #hint{display:none;font-size:12px;color:var(--muted);margin:8px 2px;line-height:1.45;}
  #error{display:none;background:#fff3f1;color:#8a2d24;border:1px solid #efb2ab;border-radius:10px;padding:10px 12px;margin:10px 2px;font-size:13px;line-height:1.45;}
  .meta{display:none;font-size:11px;color:var(--muted);margin:10px 2px 0;line-height:1.4;}
  .meta a{color:#606773;}
  #pollPanel{position:relative;z-index:2;grid-column:3;grid-row:1 / -1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;overflow:hidden;}
  .pollPanelTitle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:3px 3px 0;}
  .pollPanelTitle strong{font-size:20px;line-height:1.2;}
  .pollPanelTitle span{font-size:15px;color:var(--muted);white-space:nowrap;}
  #pollClose{display:none;border:0;background:#fff;border-radius:7px;width:26px;height:26px;font-size:15px;font-weight:900;line-height:1;cursor:pointer;box-shadow:0 1px 4px rgba(15,23,42,.16);color:#475569;}
  #pollContent{min-height:0;overflow:auto;padding-right:2px;}
  .pollSummaryList{display:grid;gap:8px;}
  .pollRegionGroup{display:grid;gap:6px;}
  .pollSummaryButton{display:grid;grid-template-columns:63px 1fr auto;align-items:center;gap:8px;width:100%;min-height:41px;border:0;border-radius:8px;padding:6px 12px;color:#fff;cursor:pointer;text-align:left;box-shadow:0 1px 3px rgba(15,23,42,.12);}
  .pollSummaryButton[data-tone="blue"]{background:#4b9af3;}
  .pollSummaryButton[data-tone="red"]{background:#ff7168;}
  .pollSummaryButton[data-tone="purple"]{background:#8b5fe8;}
  .pollSummaryButton[data-tone="gray"]{background:#d9d9d9;color:#555;}
  .pollSummaryButton.active{outline:2px solid rgba(15,23,42,.38);outline-offset:1px;}
  .pollRegion{font-size:18px;font-weight:900;}
  .pollRegion.long{font-size:14px;}
  .pollNew{justify-self:start;border-radius:6px;background:rgba(255,255,255,.86);color:#4774d5;padding:2px 8px;font-size:12px;font-weight:900;}
  .pollSummaryButton[data-tone="gray"] .pollNew{color:#777;}
  .pollLead{font-size:17px;font-weight:900;white-space:nowrap;}
  .pollRegionPanel{display:grid;gap:11px;margin:0 0 8px 0;padding:11px;border:1px solid rgba(148,163,184,.55);border-radius:8px;background:rgba(255,255,255,.46);}
  .pollRegionMeta{font-size:15px;color:var(--muted);font-weight:800;line-height:1.35;}
  .pollSurveyList{display:grid;gap:9px;}
  .pollSurveyButton{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;border:1px solid #cfd4dc;border-radius:7px;background:rgba(255,255,255,.80);padding:11px 12px;text-align:left;cursor:pointer;color:#333;}
  .pollSurveyButton.active{border-color:#64748b;background:#fff;box-shadow:0 1px 5px rgba(15,23,42,.12);}
  .pollSurveyTitle{font-size:18px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pollSurveyMeta{display:block;margin-top:3px;font-size:15px;color:#64748b;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pollChevron{font-size:20px;font-weight:900;color:#64748b;}
  .pollCards{display:grid;gap:18px;}
  .pollCardTitle{margin:0 0 6px;font-size:20px;font-weight:900;color:#333;}
  .pollCardMeta{margin:0 0 9px;font-size:17px;color:#555;font-weight:700;}

  .pollResultRow{display:grid;grid-template-columns:33px 126px 72px minmax(0,1fr);align-items:center;gap:9px;min-height:54px;padding:9px 12px;border-bottom:1px solid #d7d7d7;}
  .pollResultRow:last-child{border-bottom:0;}

  .candidateName{font-size:18px;font-weight:800;}
  .partyName{display:block;margin-top:2px;font-size:14px;font-weight:900;}
  .rate{font-size:20px;font-weight:900;text-align:right;}

  .barFill{height:100%;border-radius:99px;}
  .dem{color:#0b2c86}.demFill{background:#283c9c}
  .ppp{color:#f10c20}.pppFill{background:#ff4354}
  .reform{color:#ff6b2c}.reformFill{background:#ff8840}
  .minor{color:#475569}.minorFill{background:#64748b}
  .none{color:#555}.noneFill{background:#888}
  .pollEmpty{border:1px dashed #cbd5e1;border-radius:8px;padding:18px;color:#64748b;font-size:18px;line-height:1.45;background:rgba(255,255,255,.46);}
  @media (max-width: 720px){
    #wrap{grid-template-columns:82px minmax(0,1fr);gap:3px;padding:2px;}
    #wrap.detailMode{grid-template-columns:164px minmax(0,1fr);}
    #title{font-size:13px;}
    #back{padding:6px 8px;font-size:12px;}
    #sidoSelect{padding:6px 7px;font-size:12px;}
    #loading,#sub{font-size:10px;}
    .miniMapTitle{font-size:9px;}
    #miniNationalMap{height:300px;padding:3px;}
    #miniNationalMap .sido-label{font-size:17px;}
    #pollToggle{display:inline-block;}
    #pollPanel{position:absolute;z-index:5;grid-column:auto;grid-row:auto;left:92px;right:4px;top:4px;bottom:4px;width:auto;padding:6px;border-radius:10px;background:rgba(226,227,230,.96);box-shadow:0 8px 24px rgba(15,23,42,.22);transform:translateX(calc(100% + 10px));transition:transform .16s ease;}
    #pollPanel.open{transform:translateX(0);}
    #pollClose{display:inline-grid;place-items:center;}
    .pollPanelTitle span{display:none;}
    .pollPanelTitle strong{font-size:11px;}
    .pollSummaryButton{grid-template-columns:30px 1fr;min-height:24px;padding:3px 5px;}
    .pollNew{display:none;}
    .pollLead{font-size:9px;}
    .pollRegionPanel{padding:5px;gap:5px;}
    .pollSurveyButton{grid-template-columns:minmax(0,1fr) 12px;padding:6px 6px;}
    .pollSurveyTitle{font-size:10px;}
    .pollSurveyMeta{font-size:8px;}
    .pollResultRow{grid-template-columns:16px 52px 38px minmax(0,1fr);gap:3px;padding:5px 4px;}
    .candidateName{font-size:10px;}
    .partyName{font-size:8px;}
    .rate{font-size:10px;}
  }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <button id="back">‹ 전국</button>
    <div id="title">전국 선거구 보기</div>
    <div id="sub"></div>
    <button id="pollToggle" type="button">여론</button>
  </header>

  <div id="controls">
    <select id="sidoSelect" disabled>
      <option>선거구 데이터를 불러오는 중...</option>
    </select>
    <span id="loading">제22대 국회의원선거 지역구 경계 데이터 로딩 중</span>
    <div id="miniNationalWrap" aria-label="다른 지역으로 이동">
      <div class="miniMapTitle">다른 지역으로 이동</div>
      <div id="miniNationalMap"></div>
    </div>
  </div>

  <div id="error"></div>
  <div id="stage"></div>
  <aside id="pollPanel" aria-label="전국 시도지사 여론조사">
    <div class="pollPanelTitle">
      <strong>전국 시도지사 여론조사</strong>
      <span>5/1~5/27 조사</span>
      <button id="pollClose" type="button" aria-label="여론조사 패널 닫기">×</button>
    </div>
    <div id="pollContent"></div>
  </aside>
  <div id="hint">전국 지도에는 시·도 경계만 표시됩니다. 시·도를 클릭하면 해당 권역의 선거구만 확대해서 볼 수 있어요.</div>
<div class="meta">경계 데이터: OhmyNews 2024 제22대 국회의원 총선거 선거구 GeoJSON(MIT). 이 파일은 인터넷 연결 상태에서 원본 GeoJSON을 불러와 렌더링합니다.</div>
</div>

<script>
const DATA_URLS = [
  "https://raw.githubusercontent.com/OhmyNews/2024_22_elec_map/main/2024_22_Elec_simplify.json",
  "https://cdn.jsdelivr.net/gh/OhmyNews/2024_22_elec_map@main/2024_22_Elec_simplify.json"
];

const stage = document.getElementById('stage');
const wrap = document.getElementById('wrap');
const back  = document.getElementById('back');
const title = document.getElementById('title');
const sub   = document.getElementById('sub');
const loading = document.getElementById('loading');
const errorBox = document.getElementById('error');
const sidoSelect = document.getElementById('sidoSelect');
const miniNationalWrap = document.getElementById('miniNationalWrap');
const miniNationalMap = document.getElementById('miniNationalMap');
const pollContent = document.getElementById('pollContent');
const pollToggle = document.getElementById('pollToggle');
const pollPanel = document.getElementById('pollPanel');
const pollClose = document.getElementById('pollClose');

const SIDO_ORDER = ['서울','부산','대구','인천','대전','울산','세종','경기','강원','충북','충남','전북','전남','경북','경남','제주'];
const SIDO_FULL = {
  서울:'서울특별시', 부산:'부산광역시', 대구:'대구광역시', 인천:'인천광역시',
  대전:'대전광역시', 울산:'울산광역시', 세종:'세종특별자치시', 경기:'경기도', 강원:'강원특별자치도',
  충북:'충청북도', 충남:'충청남도', 전북:'전북특별자치도', 전남:'전남광주', 경북:'경상북도', 경남:'경상남도', 제주:'제주특별자치도'
};
const SIDO_SEARCH_ALIASES = {
  전남: ['전남광주', '전남·광주', '전라남도', '전남', '광주광역시', '광주'],
};
const POLL_REGION_ORDER = [
  {key:'서울특별시', label:'서울', sido:'서울'},
  {key:'부산광역시', label:'부산', sido:'부산'},
  {key:'대구광역시', label:'대구', sido:'대구'},
  {key:'인천광역시', label:'인천', sido:'인천'},
  {key:'전남광주통합특별시', label:'전남광주', sido:'전남'},
  {key:'대전광역시', label:'대전', sido:'대전'},
  {key:'울산광역시', label:'울산', sido:'울산'},
  {key:'세종특별자치시', label:'세종', sido:'세종'},
  {key:'경기도', label:'경기', sido:'경기'},
  {key:'강원특별자치도', label:'강원', sido:'강원'},
  {key:'충청북도', label:'충북', sido:'충북'},
  {key:'충청남도', label:'충남', sido:'충남'},
  {key:'전북특별자치도', label:'전북', sido:'전북'},
  {key:'경상북도', label:'경북', sido:'경북'},
  {key:'경상남도', label:'경남', sido:'경남'},
  {key:'제주특별자치도', label:'제주', sido:'제주'}
];
const POLL_DISPLAY_START_DATE = '2026-05-01';
const POLL_CUTOFF_END_DATE = '2026-05-27';
const POLL_SCRIPT_URLS = [
  'https://www.poll-mbc.co.kr/region_data/approve_data/region_poll_data.js',
  'https://www.poll-mbc.co.kr/region_data/candidate_info.js',
  'https://www.poll-mbc.co.kr/region_data/approve_data/front_status.js'
];
const ASSEMBLY_POLL_SCRIPT_URLS = [
  'https://www.poll-mbc.co.kr/region_data/assembly/boxplot_data.js'
];
const PARTY_STYLE = {
  '더불어민주당': {className:'dem', fillClass:'demFill', mark:'■', tone:'blue'},
  '국민의힘': {className:'ppp', fillClass:'pppFill', mark:'■', tone:'red'},
  '개혁신당': {className:'reform', fillClass:'reformFill', mark:'⌃', tone:'red'},
  minor: {className:'minor', fillClass:'minorFill', mark:'●', tone:'gray'},
  none: {className:'none', fillClass:'noneFill', mark:'×', tone:'gray'}
};

let features = [];
let currentSido = 'all';
let selectedPollRegion = '';
let expandedPollKey = '';
let pollDataStatus = 'loading';
let assemblyPollDataStatus = 'loading';
let electionMapEvent = null;
let electionPoints = [];
let cardPositionOverrides = {};
const DEFS = `
  <defs>
    <filter id="soft" x="-40%" y="-40%" width="190%" height="210%">
      <feDropShadow dx="6" dy="15" stdDeviation="13" flood-color="#3a3d44" flood-opacity="0.30"/>
    </filter>
    <linearGradient id="sheen" x1="0.15" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#eef0f2"/>
    </linearGradient>
  </defs>`;

function mercator(coord){
  const lon = coord[0] * Math.PI / 180;
  const lat = coord[1] * Math.PI / 180;
  return [lon, Math.log(Math.tan(Math.PI/4 + lat/2))];
}

function iterPositions(geom, cb){
  if(!geom) return;
  if(geom.type === 'Polygon'){
    geom.coordinates.forEach(ring => ring.forEach(cb));
  } else if(geom.type === 'MultiPolygon'){
    geom.coordinates.forEach(poly => poly.forEach(ring => ring.forEach(cb)));
  }
}

function getProjectedBBox(list){
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  list.forEach(f => iterPositions(f.geometry, pt => {
    const [x,y] = mercator(pt);
    if(x<minX) minX=x; if(y<minY) minY=y; if(x>maxX) maxX=x; if(y>maxY) maxY=y;
  }));
  return {minX,minY,maxX,maxY};
}

function makeProjector(list, mode){
  const box = getProjectedBBox(list);
  const rawW = box.maxX - box.minX;
  const rawH = box.maxY - box.minY;
  const targetW = mode === 'national' ? 1100 : 900;
  const targetH = mode === 'national' ? 1320 : 900;
  const pad = mode === 'national' ? 52 : 44;
  const scale = Math.min((targetW - pad*2) / rawW, (targetH - pad*2) / rawH);
  const drawnW = rawW * scale;
  const drawnH = rawH * scale;
  const offX = (targetW - drawnW) / 2;
  const offY = (targetH - drawnH) / 2;
  return {
    viewBox: [0,0,targetW,targetH],
    point(pt){
      const [x,y] = mercator(pt);
      return [offX + (x - box.minX)*scale, offY + (box.maxY - y)*scale];
    }
  };
}

function ringToPath(ring, project){
  if(!ring || ring.length === 0) return '';
  const pts = ring.map(project.point);
  let d = `M ${pts[0][0].toFixed(2)},${pts[0][1].toFixed(2)}`;
  for(let i=1;i<pts.length;i++) d += ` L ${pts[i][0].toFixed(2)},${pts[i][1].toFixed(2)}`;
  return d + ' Z';
}

function geomToPath(geom, project){
  if(!geom) return '';
  if(geom.type === 'Polygon'){
    return geom.coordinates.map(ring => ringToPath(ring, project)).join(' ');
  }
  if(geom.type === 'MultiPolygon'){
    return geom.coordinates.map(poly => poly.map(ring => ringToPath(ring, project)).join(' ')).join(' ');
  }
  return '';
}

function featureCode(f){
  const p = f.properties || {};
  return String(p.SGG_Code || p.SIDO_SGG || p.SGG || p.name || Math.random());
}

function featureName(f){
  const p = f.properties || {};
  return p.SIDO_SGG || `${p.SIDO || ''} ${p.SGG || ''}`.trim() || p.name || '선거구';
}

function normalizeSidoKey(sido){
  return sido === '광주' ? '전남' : sido;
}

function featureSido(f){
  return normalizeSidoKey((f.properties && f.properties.SIDO) || '기타');
}

function centroidOfFeature(f, project){
  let sx=0, sy=0, n=0;
  iterPositions(f.geometry, pt => {
    const [x,y] = project.point(pt);
    sx += x; sy += y; n++;
  });
  return n ? [sx/n, sy/n] : [0,0];
}

function visibleFeatures(){
  return currentSido === 'all' ? features : features.filter(f => featureSido(f) === currentSido);
}

function groupBy(arr, keyFn){
  return arr.reduce((acc, item) => {
    const k = keyFn(item) || '기타';
    (acc[k] ||= []).push(item);
    return acc;
  }, {});
}

function escapeHtml(v){
  return String(v ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
}

function normalizeMapText(value){
  return String(value ?? '').replace(/\s+/g, '').toLowerCase();
}

function joinedPointText(point){
  return [point.region, point.place, point.address, point.note].map(normalizeMapText).join(' ');
}

function inferPointSido(point){
  const text = joinedPointText(point);
  for(const sido of SIDO_ORDER){
    const aliases = SIDO_SEARCH_ALIASES[sido] || [SIDO_FULL[sido], sido];
    if(aliases.some(alias => text.includes(normalizeMapText(alias)))) return sido;
  }
  return '';
}

function joinSlash(values){

function loadScript(src){
  return new Promise((resolve, reject) => {
    const existing = document.querySelector(`script[src="${src}"]`);
    if(existing){ resolve(); return; }
    const script = document.createElement('script');
    script.src = src;
    script.onload = () => resolve();
    script.onerror = () => reject(new Error(`failed to load ${src}`));
    document.head.appendChild(script);
  });
}

async function loadPollData(){
  pollDataStatus = 'loading';
  assemblyPollDataStatus = 'loading';
  renderPollPanel();
  try{
    for(const src of POLL_SCRIPT_URLS) await loadScript(src);
    pollDataStatus = 'ready';
  }catch(e){
    pollDataStatus = 'error';
  }
  try{
    for(const src of ASSEMBLY_POLL_SCRIPT_URLS) await loadScript(src);
    assemblyPollDataStatus = 'ready';
  }catch(e){
    assemblyPollDataStatus = 'error';
  }
  renderPollPanel();
}

  const allPolls = Array.isArray(window.region_poll_data) ? window.region_poll_data : [];
  return allPolls
    .filter(poll => poll && poll.region === regionKey && poll.end >= POLL_DISPLAY_START_DATE && poll.end <= POLL_CUTOFF_END_DATE)
    .sort((a,b) => String(b.end || '').localeCompare(String(a.end || '')) || String(b.start || '').localeCompare(String(a.start || '')) || Number(b.index || 0) - Number(a.index || 0));

function getPartyForCandidate(regionKey, candidateName){
  if(/없음|무응답|모름|기타/.test(candidateName)) return 'none';
  const info = window.candidate_info && window.candidate_info[regionKey];
  const found = Array.isArray(info) ? info.find(candidate => candidate.name === candidateName) : null;
  return found?.party || '';

  const party = getPartyForCandidate(regionKey, candidateName);

function getLatestPoll(regionKey){

function getPollKey(regionKey, poll, index){
  return [regionKey, poll?.index ?? index, poll?.house || '', poll?.client || '', poll?.start || '', poll?.end || ''].join('|');
}

function getPollLeadingRows(poll){
  return getPollRows(poll)
    .filter(row => !/없음|무응답|모름|기타/.test(row.name))
    .sort((a,b) => b.value - a.value);
}

function getRequiredPollWins(pollCount){
  if(pollCount <= 0) return 0;
  return Math.min(3, Math.floor(pollCount / 2) + 1);
}

function getRecentPollConsensus(regionKey){
  const recentPolls = getPollsForRegion(regionKey).slice(0, 5);
  if(!recentPolls.length) return null;
  const requiredWins = getRequiredPollWins(recentPolls.length);

  const winCounts = new Map();
  const valueSums = new Map();
  const valueCounts = new Map();

  recentPolls.forEach(poll => {
    const rows = getPollLeadingRows(poll);
    rows.forEach(row => {
      valueSums.set(row.name, (valueSums.get(row.name) || 0) + row.value);
      valueCounts.set(row.name, (valueCounts.get(row.name) || 0) + 1);
    });

    const lead = rows[0];
    const second = rows[1];
    if(lead && (!second || lead.value > second.value)){
      winCounts.set(lead.name, (winCounts.get(lead.name) || 0) + 1);
    }
  });

  const candidates = Array.from(valueSums.keys()).map(name => ({
    name,
    wins: winCounts.get(name) || 0,
    average: valueSums.get(name) / Math.max(1, valueCounts.get(name) || 1),
  })).sort((a,b) => b.wins - a.wins || b.average - a.average);
  const winner = candidates[0];
  if(!winner || winner.wins < requiredWins) return {winner, margin: 0, decisive: false};

  const runnerUp = candidates
    .filter(candidate => candidate.name !== winner.name)
    .sort((a,b) => b.average - a.average)[0];
  const margin = runnerUp ? winner.average - runnerUp.average : Infinity;
  return {winner, margin, decisive: margin >= 5};
}

function getPollSummary(region){
  const consensus = getRecentPollConsensus(region.key);
  if(!consensus) return {label: pollDataStatus === 'ready' ? '준비중' : '불러오는 중', tone:'gray', isNew:false};
  const isNewMap = window.isNew || {};
  if(!consensus.decisive || !consensus.winner){
    return {label:'경합', tone:'purple', isNew: Boolean(isNewMap[region.key])};
  }
  const style = getPartyStyle(region.key, consensus.winner.name);
  return {label: `${consensus.winner.name} 우세`, tone: style.tone, isNew: Boolean(isNewMap[region.key])};
}

  if(region.sido === '전남') return `${region.label} 시도지사`;

function getLocalPollEntries(sido){
  const entries = [];
  POLL_REGION_ORDER
    .filter(region => region.sido === sido)
    .forEach(region => {
      const polls = getPollsForRegion(region.key);
      if(polls.length < 2) return;
      const summary = getPollSummary(region);
      entries.push({
        type: 'governor',
        key: `governor|${region.key}`,
        title: getSidoElectionTitle(region),
        meta: `등록 여론조사 ${polls.length}개 · ${POLL_DISPLAY_START_DATE}~${POLL_CUTOFF_END_DATE}`,
        label: summary.label,
        tone: summary.tone,
        region,
      });
    });

  getAssemblyPollItemsForSido(sido).forEach(item => {
    const first = item.rank?.first;
    const second = item.rank?.second;
    const margin = first && second ? Number(first.val || 0) - Number(second.val || 0) : 0;
    const style = PARTY_STYLE[first?.party] || PARTY_STYLE.minor;
    entries.push({
      type: 'assembly',
      key: `assembly|${item.consti}`,
      title: `${item.region1_site || item.region1 || sido}${item.region2_site || item.region2 || ''} 재보궐`,
      meta: `분석 여론조사 ${Number(item.count || 0)}개 · ${item.start || ''}~${item.end || ''}`,
      label: first ? `${first.name} ${margin >= 5 ? '우세' : '경합'}` : (item.state || '분석 중'),
      tone: margin >= 5 ? style.tone : 'purple',
      item,
    });
  });
  return entries;
}

      <span class="pollRegion ${region.label.length > 3 ? 'long' : ''}">${escapeHtml(region.label)}</span>
      <span class="pollNew">${summary.isNew ? 'NEW' : ''}</span>
      <span class="pollLead">${escapeHtml(summary.label)}</span>
      </button>
      ${active ? renderPollRegionPanel(region) : ''}
    </div>`;
  }).join('');
  pollContent.innerHTML = `<div class="pollSummaryList">${summaryList}</div>`;
  pollContent.querySelectorAll('.pollSummaryButton').forEach(button => {
    button.addEventListener('click', () => {
      const nextRegion = button.dataset.region || selectedPollRegion;
      selectedPollRegion = selectedPollRegion === nextRegion ? '' : nextRegion;
      expandedPollKey = '';
      renderPollPanel();
    });
  });
  pollContent.querySelectorAll('.pollSurveyButton').forEach(button => {
    button.addEventListener('click', (event) => {
      event.stopPropagation();
      const nextKey = button.dataset.pollKey || '';
      expandedPollKey = expandedPollKey === nextKey ? '' : nextKey;
      renderPollPanel();
    });
  });
}

function roundCoord(v){ return Number(v).toFixed(6); }
function samePoint(a,b){ return a && b && Math.abs(a[0]-b[0]) < 1e-10 && Math.abs(a[1]-b[1]) < 1e-10; }
function segmentKey(a,b){
  const ak = `${roundCoord(a[0])},${roundCoord(a[1])}`;
  const bk = `${roundCoord(b[0])},${roundCoord(b[1])}`;
  return ak < bk ? `${ak}|${bk}` : `${bk}|${ak}`;
}

function addBoundaryRing(segmentMap, ring, sido){
  if(!ring || ring.length < 2) return;
  const closed = samePoint(ring[0], ring[ring.length-1]);
  const end = closed ? ring.length - 1 : ring.length;
  for(let i=0; i<end; i++){
    const a = ring[i];
    const b = ring[(i+1) % ring.length];
    if(!a || !b || samePoint(a,b)) continue;
    const key = segmentKey(a,b);
    let rec = segmentMap.get(key);
    if(!rec){ rec = {a, b, sidos:new Set(), count:0}; segmentMap.set(key, rec); }
    rec.sidos.add(sido);
    rec.count += 1;
  }
}

function collectSidoBoundaryPath(list, project){
  const segmentMap = new Map();
  list.forEach(f => {
    const sido = featureSido(f);
    const geom = f.geometry;
    if(!geom) return;
    if(geom.type === 'Polygon'){
      geom.coordinates.forEach(ring => addBoundaryRing(segmentMap, ring, sido));
    } else if(geom.type === 'MultiPolygon'){
      geom.coordinates.forEach(poly => poly.forEach(ring => addBoundaryRing(segmentMap, ring, sido)));
    }
  });

  let d = '';
  segmentMap.forEach(rec => {
    // 1개만 있는 선분은 외곽/해안선, 여러 시도가 공유하는 선분은 시·도 경계.
    // 같은 시도 안에서 2번 공유되는 선분은 선거구 내부 경계이므로 전국지도에서는 숨김.
    if(rec.count === 1 || rec.sidos.size > 1){
      const [x1,y1] = project.point(rec.a);
      const [x2,y2] = project.point(rec.b);
      d += `M ${x1.toFixed(2)},${y1.toFixed(2)} L ${x2.toFixed(2)},${y2.toFixed(2)} `;
    }
  });
  return d;
}

function clamp(value, min, max){
  return Math.max(min, Math.min(max, value));
}

function rectsOverlap(a, b, gap = 10){
  return !(
    a.x + a.w + gap <= b.x ||
    b.x + b.w + gap <= a.x ||
    a.y + a.h + gap <= b.y ||
    b.y + b.h + gap <= a.y
  );
}

function getCardPositionKey(point, scope = 'detail'){
  return [
    electionMapEvent?.id || electionMapEvent?.title || 'draft',
    currentSido,
    scope,
    point.index,
    point.region,
    point.place,
  ].map(value => String(value ?? '').replace(/[|]/g, '')).join('|');
}

function getCardEdgePoint(card, pinX, pinY){
  const centerX = card.x + card.w / 2;
  const centerY = card.y + card.h / 2;
  const dx = pinX - centerX;
  const dy = pinY - centerY;
  if(Math.abs(dx) > Math.abs(dy)){
    return {
      x: dx > 0 ? card.x + card.w : card.x,
      y: clamp(pinY, card.y + 14, card.y + card.h - 14),
    };
  }
  return {
    x: clamp(pinX, card.x + 14, card.x + card.w - 14),
    y: dy > 0 ? card.y + card.h : card.y,
  };
}

function getNonOverlappingCardRect(pinX, pinY, index, cardW, cardH, placedRects){
  const minX = 14;
  const minY = 14;
  const maxX = 900 - cardW - 14;
  const maxY = 900 - cardH - 14;
  const side = pinX < 450 ? 1 : -1;
  const candidates = [];

  for(let ring = 0; ring < 7; ring++){
    const horizontal = 38 + ring * 30;
    const verticalStep = 26 + ring * 10;
    [-2,-1,0,1,2].forEach(offset => {
      candidates.push({
        x: clamp(pinX + side * horizontal - (side < 0 ? cardW : 0), minX, maxX),
        y: clamp(pinY - cardH / 2 + offset * verticalStep, minY, maxY),
      });
    });
    candidates.push({
      x: clamp(pinX - cardW / 2, minX, maxX),
      y: clamp(pinY + 40 + ring * 22, minY, maxY),
    });
    candidates.push({
      x: clamp(pinX - cardW / 2, minX, maxX),
      y: clamp(pinY - cardH - 40 - ring * 22, minY, maxY),
    });
  }

  const gridXs = [18, 900 - cardW - 18];
  for(let row = 0; row < 8; row++){
    gridXs.forEach(x => {
      candidates.push({
        x: clamp(x, minX, maxX),
        y: clamp(18 + row * (cardH + 12), minY, maxY),
      });
    });
  }

  const chosen = candidates.find(candidate => !placedRects.some(rect => rectsOverlap({...candidate, w: cardW, h: cardH}, rect)));
  const position = chosen || candidates[candidates.length - 1];
  return {x: position.x, y: position.y, w: cardW, h: cardH};
}

function getSidoCentroids(project){
  const bySido = groupBy(features, featureSido);
  return SIDO_ORDER.reduce((acc, sido) => {
    const group = bySido[sido];
    if(!group || !group.length) return acc;
    let sx=0, sy=0, n=0;
    group.forEach(f => {
      const c = centroidOfFeature(f, project);
      sx += c[0];
      sy += c[1];
      n++;
    });
    if(n) acc[sido] = [sx/n, sy/n];
    return acc;
  }, {});
}

function renderNationalPointPins(project){
  const centroids = getSidoCentroids(project);
  const grouped = electionPoints.reduce((acc, point) => {
    if(!point.sido) return acc;
    (acc[point.sido] ||= []).push(point);
    return acc;
  }, {});
  return Object.entries(grouped).map(([sido, points]) => {
    const center = centroids[sido];
    if(!center) return '';
    const [x,y] = center;
    return `<g class="election-national-pin" data-sido="${escapeHtml(sido)}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})">
      <circle class="election-pin-dot" r="17"></circle>
      <text class="election-pin-count" y="1">${points.length}</text>
    </g>`;
  }).join('');
}

function getFeatureDistrictTokens(f){
  const sido = featureSido(f);
  const rawName = featureName(f);
  const normalizedName = normalizeMapText(rawName);
  const full = normalizeMapText(SIDO_FULL[sido] || '');
  const shortSido = normalizeMapText(sido);
  const withoutSido = normalizedName.replace(full, '').replace(shortSido, '');
  const parts = withoutSido.split(/[·ㆍ,()/-]/).filter(Boolean);
  return Array.from(new Set([withoutSido, ...parts, normalizedName].filter(token => token.length >= 2)));
}

function getDetailPointAnchor(point, anchors){
  const text = joinedPointText(point);
  const matched = anchors.find(anchor => anchor.tokens.some(token => text.includes(token)));
  return matched || null;
}

function getPointsForDistrict(feature){
  if(!feature) return [];
  const anchor = {
    key: featureCode(feature),
    tokens: getFeatureDistrictTokens(feature),
  };
  return electionPoints.filter(point =>
    point.sido === currentSido &&
    anchor.tokens.some(token => joinedPointText(point).includes(token))
  );
}

function isExpandableCardValue(label, value){
  const text = String(value ?? '').trim();
  return /주소|비고/.test(label) || text.length > 14 || /\r|\n/.test(text);
}

function renderPointCardRow(label, value){
  const text = String(value ?? '').trim();
  const expandable = isExpandableCardValue(label, text);
  const wide = /주소|비고/.test(label);
  const classes = ['election-card-row', wide ? 'wide' : '', expandable ? 'expandable' : ''].filter(Boolean).join(' ');
  const attrs = expandable ? ` data-full="${escapeHtml(text)}" title="${escapeHtml(text)}"` : '';
  return `<div class="${classes}"${attrs}><b>${escapeHtml(label)}</b><span class="election-card-value">${escapeHtml(text)}</span></div>`;
}

function renderPointCard(point){
  const rows = pointToCardRows(point).map(([label, value]) => renderPointCardRow(label, value)).join('');
  return `<div xmlns="http://www.w3.org/1999/xhtml" class="election-card">
    <div class="election-card-title"><span class="election-card-badge">${Number(point.index) + 1}</span><span class="election-card-title-text">${escapeHtml(getPointTitle(point))}</span></div>
    <div class="election-card-grid">${rows || '<div class="election-card-row"><b>내용</b><span class="election-card-value">표 입력 대기</span></div>'}</div>
  </div>`;
}

function renderDetailPointPins(list, project){
  const points = electionPoints.filter(point => point.sido === currentSido);
  if(!points.length) return '';

  const anchors = list.map(f => {
    const center = centroidOfFeature(f, project);
    return {
      feature: f,
      key: featureCode(f),
      x: center[0],
      y: center[1],
      tokens: getFeatureDistrictTokens(f),
    };
  });
  const fallback = anchors.reduce((acc, anchor) => ({x: acc.x + anchor.x, y: acc.y + anchor.y}), {x:0, y:0});
  fallback.x = anchors.length ? fallback.x / anchors.length : 450;
  fallback.y = anchors.length ? fallback.y / anchors.length : 450;

  const anchorCounts = {};
  const placedRects = [];
  const cardW = 304;
  const cardH = 178;
  const lines = [];
  const nodes = [];
  points.forEach((point, index) => {
    const anchor = getDetailPointAnchor(point, anchors);
    const key = anchor?.key || `fallback-${currentSido}`;
    const order = anchorCounts[key] || 0;
    anchorCounts[key] = order + 1;
    const baseX = anchor?.x ?? fallback.x;
    const baseY = anchor?.y ?? fallback.y;
    const angle = (order * 67) * Math.PI / 180;
    const radius = order ? 15 + Math.min(order, 5) * 5 : 0;
    const x = clamp(baseX + Math.cos(angle) * radius, 24, 876);
    const y = clamp(baseY + Math.sin(angle) * radius, 24, 876);
    const cardKey = getCardPositionKey(point, 'sido');
    const override = cardPositionOverrides[cardKey];
    const cardRect = override
      ? {x: clamp(Number(override.x) || 0, 14, 900 - cardW - 14), y: clamp(Number(override.y) || 0, 14, 900 - cardH - 14), w: cardW, h: cardH}
      : getNonOverlappingCardRect(x, y, index, cardW, cardH, placedRects);
    placedRects.push(cardRect);
    const edge = getCardEdgePoint(cardRect, x, y);
    lines.push(`<line class="election-pin-line" data-card-key="${escapeHtml(cardKey)}" x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${edge.x.toFixed(1)}" y2="${edge.y.toFixed(1)}"></line>`);
    nodes.push(`<g class="election-point-node">
      <circle class="election-point-pin" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="13"></circle>
      <text class="election-point-number" x="${x.toFixed(1)}" y="${(y + 0.5).toFixed(1)}">${Number(point.index) + 1}</text>
      <foreignObject class="election-card-fo" data-card-key="${escapeHtml(cardKey)}" data-pin-x="${x.toFixed(1)}" data-pin-y="${y.toFixed(1)}" x="${cardRect.x.toFixed(1)}" y="${cardRect.y.toFixed(1)}" width="${cardW}" height="${cardH}">${renderPointCard(point)}</foreignObject>
    </g>`);
  });
  return `<g class="election-point-layer">${lines.join('')}${nodes.join('')}</g>`;
}

function buildNationalSVG(){
  const list = features;
  const project = makeProjector(list, 'national');
  const [x,y,w,h] = project.viewBox;
  const paths = list.map(f => ({ f, d: geomToPath(f.geometry, project) }));

  let s = `<svg viewBox="${x} ${y} ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${DEFS}`;
  // 전체 면은 모든 선거구를 같은 면으로 채워서 내부 선거구 선이 보이지 않게 함.
  s += `<g class="base" filter="url(#soft)">`;
  paths.forEach(p => { s += `<path d="${p.d}" fill-rule="evenodd"/>`; });
  s += `</g>`;

  // 전국지도에는 시·도 외곽/경계만 표시.
  s += `<path class="sido-boundary" d="${collectSidoBoundaryPath(list, project)}"/>`;

  // 클릭용 투명 레이어. 내부 선거구 선은 그리지 않고 클릭만 받음.
  paths.forEach(p => {
    const sido = featureSido(p.f);
    const name = SIDO_FULL[sido] || sido;
    s += `<path class="sido-hit" data-sido="${escapeHtml(sido)}" data-name="${escapeHtml(name)}" d="${p.d}" fill-rule="evenodd"><title>${escapeHtml(name)}</title></path>`;
  });

  // 시·도 라벨.
  const centroids = getSidoCentroids(project);
  for(const sido of SIDO_ORDER){
    const center = centroids[sido];
    if(center) s += `<text class="sido-label" x="${center[0].toFixed(1)}" y="${center[1].toFixed(1)}">${escapeHtml(sido)}</text>`;
  }
  s += renderNationalPointPins(project);
  s += `</svg>`;
  return s;
}

function buildDistrictSVG(list){
  const project = makeProjector(list, 'detail');
  const [x,y,w,h] = project.viewBox;
  const paths = list.map(f => ({ f, d: geomToPath(f.geometry, project) }));
  let s = `<svg viewBox="${x} ${y} ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${DEFS}`;
  s += `<g class="base" filter="url(#soft)">`;
  paths.forEach(p => { s += `<path d="${p.d}" fill-rule="evenodd"/>`; });
  s += `</g>`;
  paths.forEach(p => {
    const code = featureCode(p.f);
    const name = featureName(p.f);
    const pointCount = getPointsForDistrict(p.f).length;
    const pointHint = pointCount ? ` · 포인트 ${pointCount}개` : '';
    s += `<path class="rg" data-code="${escapeHtml(code)}" data-name="${escapeHtml(name)}" data-sido="${escapeHtml(featureSido(p.f))}" data-point-count="${pointCount}" d="${p.d}" fill-rule="evenodd"><title>${escapeHtml(name)}${escapeHtml(pointHint)}</title></path>`;
  });
  s += renderDetailPointPins(list, project);
  s += `</svg>`;
  return s;
}

function navigateToSido(sido){
  if(!sido || currentSido === sido) return;
  currentSido = sido;
  selectedPollRegion = '';
  expandedPollKey = '';
  pollPanel?.classList.remove('open');
  render();
}

function attachSidoNavigation(root){
  root.querySelectorAll('.sido-hit').forEach(p => {
    const sido = p.dataset.sido;
    if(sido === currentSido) p.classList.add('current');
    p.addEventListener('click', () => navigateToSido(sido));
    p.addEventListener('mouseenter', () => {
      root.querySelectorAll(`.sido-hit[data-sido="${CSS.escape(sido)}"]`).forEach(el => el.classList.add('hovered'));
      sub.textContent = `${p.dataset.name}  ›`;
    });
    p.addEventListener('mouseleave', () => {
      root.querySelectorAll(`.sido-hit[data-sido="${CSS.escape(sido)}"]`).forEach(el => el.classList.remove('hovered'));
      sub.textContent = '';
    });
  });
}

function attachNationalPointNavigation(root){
  root.querySelectorAll('.election-national-pin').forEach(pin => {
    const sido = pin.dataset.sido;
    pin.addEventListener('click', (event) => {
      event.stopPropagation();
      navigateToSido(sido);
    });
  });
}

function svgClientPoint(svg, clientX, clientY){
  const point = svg.createSVGPoint();
  point.x = clientX;
  point.y = clientY;
  return point.matrixTransform(svg.getScreenCTM().inverse());
}

function attachCardTextExpansion(root){
  root.querySelectorAll('.election-card-row.expandable').forEach(row => {
    row.addEventListener('pointerdown', event => {
      event.stopPropagation();
    });
    row.addEventListener('click', event => {
      event.preventDefault();
      event.stopPropagation();
      row.classList.toggle('expanded');
    });
  });
}

function attachCardDragging(root){
  const svg = root instanceof SVGSVGElement ? root : root.querySelector('svg');
  if(!svg) return;
  attachCardTextExpansion(root);
  root.querySelectorAll('.election-card-fo').forEach(card => {
    card.addEventListener('pointerdown', event => {
      if(event.target.closest?.('.election-card-row.expandable')) return;
      event.preventDefault();
      event.stopPropagation();
      const key = card.dataset.cardKey;
      if(!key) return;
      const start = svgClientPoint(svg, event.clientX, event.clientY);
      const startX = Number(card.getAttribute('x')) || 0;
      const startY = Number(card.getAttribute('y')) || 0;
      const cardW = Number(card.getAttribute('width')) || 304;
      const cardH = Number(card.getAttribute('height')) || 178;
      const pinX = Number(card.dataset.pinX) || 0;
      const pinY = Number(card.dataset.pinY) || 0;
      const line = root.querySelector(`.election-pin-line[data-card-key="${CSS.escape(key)}"]`);

      card.classList.add('dragging');
      card.setPointerCapture?.(event.pointerId);

      const moveCard = (clientX, clientY) => {
        const current = svgClientPoint(svg, clientX, clientY);
        const next = {
          x: clamp(startX + current.x - start.x, 14, 900 - cardW - 14),
          y: clamp(startY + current.y - start.y, 14, 900 - cardH - 14),
          w: cardW,
          h: cardH,
        };
        card.setAttribute('x', next.x.toFixed(1));
        card.setAttribute('y', next.y.toFixed(1));
        cardPositionOverrides[key] = {x: next.x, y: next.y};
        if(line){
          const edge = getCardEdgePoint(next, pinX, pinY);
          line.setAttribute('x2', edge.x.toFixed(1));
          line.setAttribute('y2', edge.y.toFixed(1));
        }
      };

      const handlePointerMove = pointerEvent => moveCard(pointerEvent.clientX, pointerEvent.clientY);
      const handlePointerUp = pointerEvent => {
        moveCard(pointerEvent.clientX, pointerEvent.clientY);
        card.classList.remove('dragging');
        card.releasePointerCapture?.(pointerEvent.pointerId);
        window.removeEventListener('pointermove', handlePointerMove);
        window.removeEventListener('pointerup', handlePointerUp);
        window.removeEventListener('pointercancel', handlePointerUp);
      };

      window.addEventListener('pointermove', handlePointerMove);
      window.addEventListener('pointerup', handlePointerUp);
      window.addEventListener('pointercancel', handlePointerUp);
    });
  });
}

function renderMiniNationalMap(){
  if(!miniNationalWrap || !miniNationalMap) return;
  if(currentSido === 'all'){
    wrap?.classList.remove('detailMode');
    miniNationalWrap.classList.remove('open');
    miniNationalMap.innerHTML = '';
    return;
  }
  wrap?.classList.add('detailMode');
  miniNationalWrap.classList.add('open');
  miniNationalMap.innerHTML = buildNationalSVG();
  attachSidoNavigation(miniNationalMap);
  attachNationalPointNavigation(miniNationalMap);
  attachCardDragging(miniNationalMap);
}

function render(){
  if(!features.length) return;
  sub.textContent = '';
  sidoSelect.value = currentSido;

  if(currentSido === 'all'){
    stage.innerHTML = buildNationalSVG();
    title.textContent = '전국 선거구 보기';
    back.style.display = 'none';
    renderMiniNationalMap();
    attachSidoNavigation(stage);
    attachNationalPointNavigation(stage);
    renderPollPanel();
    return;
  }

  const list = visibleFeatures();
  if(!list.length) return;
  stage.innerHTML = buildDistrictSVG(list);
  title.textContent = `${SIDO_FULL[currentSido] || currentSido} 선거구`;
  back.style.display = 'inline-block';
  renderMiniNationalMap();
  document.querySelectorAll('.rg').forEach(p => {
    p.addEventListener('mouseenter', () => {
      const count = Number(p.dataset.pointCount || 0);
      sub.textContent = count ? `${p.dataset.name} · 포인트 ${count}개` : p.dataset.name;
    });
    p.addEventListener('mouseleave', () => { sub.textContent = ''; });
  });
  attachCardDragging(stage);
  renderPollPanel();
}

function setupSelect(){
  const available = new Set(features.map(featureSido));
  sidoSelect.innerHTML = `<option value="all">전국 시·도 보기</option>` + SIDO_ORDER
    .filter(s => available.has(s))
    .map(s => `<option value="${escapeHtml(s)}">${escapeHtml(SIDO_FULL[s] || s)}</option>`).join('');
  sidoSelect.disabled = false;
  sidoSelect.value = currentSido;
  sidoSelect.addEventListener('change', () => {
    currentSido = sidoSelect.value;
    render();
  });
}

async function fetchJSON(){
  let lastErr;
  for(const url of DATA_URLS){
    try{
      const res = await fetch(url, {cache:'force-cache'});
      if(!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      return await res.json();
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('데이터를 불러오지 못했습니다.');
}

async function init(){
  try{
    const gj = await fetchJSON();
    features = (gj.features || []).filter(f => f && f.geometry && f.properties);
    features.sort((a,b) => featureCode(a).localeCompare(featureCode(b), 'ko'));
    loading.textContent = `데이터 로딩 완료 · ${features.length}개 지역구`;
    setupSelect();
    render();
  }catch(e){
    loading.textContent = '데이터 로딩 실패';
    errorBox.style.display = 'block';
    errorBox.innerHTML = `선거구 경계 데이터를 불러오지 못했습니다.<br>인터넷 연결 또는 GitHub(raw.githubusercontent.com) 접속 가능 여부를 확인해 주세요.<br><small>${escapeHtml(e.message || e)}</small>`;
  }
}

back.addEventListener('click', () => {
  currentSido='all';
  selectedPollRegion='';
  expandedPollKey='';
  sub.textContent='';

});

pollClose?.addEventListener('click', () => pollPanel?.classList.remove('open'));
